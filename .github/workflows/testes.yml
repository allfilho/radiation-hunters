# Roda a suíte completa só quando você pedir (aba Actions > Testes > Run workflow, escolhendo a branch) ou em pull request para main.
# Não roda mais a cada push: cada rodada leva 25 a 40 minutos e gasta os minutos do plano do GitHub. A suíte local (tests/rodar-testes.sh) é a verificação do dia a dia.
name: Testes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suite:
    runs-on: ubuntu-24.04   # fixo: o Playwright 1.56 não instala dependências no ubuntu-latest novo (26)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        working-directory: tests
        run: npm ci
      - name: Instalar o Chromium
        working-directory: tests
        run: npx playwright-core install --with-deps chromium
      - name: Rodar a suíte
        working-directory: tests
        run: bash rodar-testes.sh --orcamento 0 -j 2
      - name: Guardar os logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-dos-testes
          path: logs/
