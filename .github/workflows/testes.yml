# Roda a suíte completa a cada push em desenvolvimento (e em pull requests para main), para não depender do computador de ninguém.
# Os resultados aparecem na aba Actions do GitHub. Uma rodada leva em torno de 25 a 40 minutos.
name: Testes
on:
  push:
    branches: [desenvolvimento]
    paths: ['current/**', 'tests/**', '.github/workflows/testes.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        working-directory: tests
        run: npm ci
      - name: Instalar o Chromium
        working-directory: tests
        run: npx playwright-core install --with-deps chromium
      - name: Rodar a suíte
        working-directory: tests
        run: bash rodar-testes.sh --orcamento 0 -j 2
      - name: Guardar os logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-dos-testes
          path: logs/
