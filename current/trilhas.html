<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trilhas sonoras – Radiation Hunters</title>
<style>
    :root { --bg: #0b1020; --card: #151c33; --linha: #27325a; --texto: #e8ecf8; --suave: #9aa6c8; --acento: #5eead4; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px 48px; background: var(--bg); color: var(--texto); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    p.sub { margin: 0 0 20px; color: var(--suave); }
    .vol { display: flex; align-items: center; gap: 12px; margin: 0 0 20px; padding: 12px 16px; background: var(--card); border: 1px solid var(--linha); border-radius: 12px; }
    .vol input { flex: 1; accent-color: var(--acento); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    li { display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: var(--card); border: 1px solid var(--linha); border-radius: 12px; }
    li.tocando { border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento) inset; }
    button { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--acento); color: #04201c; font-size: 18px; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .num { flex: 0 0 auto; width: 28px; text-align: center; color: var(--suave); font-variant-numeric: tabular-nums; }
    .txt { min-width: 0; }
    .nome { font-weight: 600; }
    .clima { color: var(--suave); font-size: 14px; }
    .meta { color: var(--suave); font-size: 12px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
    <h1>Trilhas sonoras</h1>
    <p class="sub">Ouvir cada faixa separadamente. As 12 trilhas são composições originais geradas por código, uma por missão.</p>
    <div class="vol"><label for="vol">Volume</label><input id="vol" type="range" min="0" max="100" value="60"><output id="volv">60</output></div>
    <ul id="lista"></ul>
</main>
<script type="module">
import { audioManager } from './js/audio.js';
import { TRILHAS } from './js/musica/trilhas.js';
import { compilar, duracaoDoCiclo } from './js/musica/partitura.js';

const lista = document.getElementById('lista'), vol = document.getElementById('vol'), volv = document.getElementById('volv');
let atual = null;
const NOMES = { 1: 'Missão 1', 2: 'Missão 2', 3: 'Missão 3', 4: 'Missão 4', 5: 'Missão 5', 6: 'Missão 6', 7: 'Missão 7', 8: 'Missão 8', 9: 'Investigação 9', 10: 'Investigação 10', 11: 'Investigação 11', 12: 'Investigação 12' };
const botoes = {};
for (const t of TRILHAS) {
    const c = compilar(t);
    const li = document.createElement('li');
    li.innerHTML = `<span class="num">${t.id}</span><button type="button" aria-label="Tocar ${t.nome.pt}">▶</button><div class="txt"><div class="nome"></div><div class="clima"></div><div class="meta"></div></div>`;
    li.querySelector('.nome').textContent = `${t.nome.pt} (${NOMES[t.id]})`;
    li.querySelector('.clima').textContent = t.clima.pt;
    li.querySelector('.meta').textContent = `${t.bpm} bpm · ${t.tonica} ${t.modo} · ciclo de ${Math.round(duracaoDoCiclo(c))} s`;
    const b = li.querySelector('button');
    b.addEventListener('click', () => {
        audioManager.init();
        if (atual === t.id) { audioManager.stopMusic(); atual = null; }
        else { audioManager.setMusicVolume(Number(vol.value)); audioManager.startMusic(t.id); atual = t.id; }
        for (const [id, x] of Object.entries(botoes)) { const on = Number(id) === atual; x.b.textContent = on ? '■' : '▶'; x.b.setAttribute('aria-label', (on ? 'Parar ' : 'Tocar ') + TRILHAS.find((y) => y.id === Number(id)).nome.pt); x.li.classList.toggle('tocando', on); }
    });
    botoes[t.id] = { b, li };
    lista.append(li);
}
vol.addEventListener('input', () => { volv.textContent = vol.value; audioManager.setMusicVolume(Number(vol.value)); });
</script>
</body>
</html>
